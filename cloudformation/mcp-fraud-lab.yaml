        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Connector:
            Source:
              ConnectorId: bedrock-knowledge-bases
            Configurations:
              - Name: Retrieve
                ParameterValues:
