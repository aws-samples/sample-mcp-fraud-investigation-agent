  # --- Deploy Investigation API ---
  InvestigationApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetTransactionMethod
      - HoldTransactionMethod
      - GetCustomerProfileMethod
      - GetLoginActivityMethod
    Properties:
      RestApiId: !Ref InvestigationApi

  InvestigationApiStage:
