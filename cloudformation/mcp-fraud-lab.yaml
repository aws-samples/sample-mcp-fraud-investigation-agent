            {
              "TableName": "${CustomerProfilesTable}",
              "Key": {
                "customer_id": {"S": "$input.params('customer_id')"}
              }
            }
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: |
                #set($item = $input.path('$.Item'))
                #if($item && $item != "")
                {
                  "customer_id": "$item.customer_id.S",
                  "name": "$item.name.S",
                  "email": "$item.email.S",
                  "member_since": "$item.member_since.S",
