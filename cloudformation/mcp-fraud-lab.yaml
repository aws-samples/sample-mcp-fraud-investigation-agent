                  "typical_shipping_city": "$item.typical_shipping_city.S",
                  "typical_shipping_state": "$item.typical_shipping_state.S",
                  "normal_hours_start": "$item.normal_hours_start.S",
                  "normal_hours_end": "$item.normal_hours_end.S",
                  "total_orders": "$item.total_orders.S",
                  "account_status": "$item.account_status.S"
                }
                #else
                {"error": "Customer not found"}
                #end
      MethodResponses:
        - StatusCode: '200'

  # --- /logins/{customer_id} GET ---
  LoginsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InvestigationApi
      ParentId: !GetAtt InvestigationApi.RootResourceId
      PathPart: logins

  LoginCustomerIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InvestigationApi
      ParentId: !Ref LoginsResource
      PathPart: '{customer_id}'

  GetLoginActivityMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref InvestigationApi
      ResourceId: !Ref LoginCustomerIdResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      OperationName: get_login_activity
      RequestParameters:
        method.request.path.customer_id: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:dynamodb:action/GetItem'
        Credentials: !GetAtt ApiGatewayDynamoDBRole.Arn
        RequestTemplates:
          application/json: !Sub |
            {
              "TableName": "${LoginActivityTable}",
              "Key": {
                "customer_id": {"S": "$input.params('customer_id')"}
              }
            }
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: |
                #set($item = $input.path('$.Item'))
                #if($item && $item != "")
                {
                  "customer_id": "$item.customer_id.S",
                  "events": $item.events.S
                }
