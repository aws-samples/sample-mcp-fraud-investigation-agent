      DeploymentId: !Ref InvestigationApiDeployment
      StageName: prod
      Description: Production stage for investigation API
      TracingEnabled: true


  # =========================================================================
  # 9. API GATEWAY - S3 Direct Integration (1 tool: get_support_cases)
  # =========================================================================
  ApiGatewayS3Role:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-apigw-s3-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub '${SupportCasesBucket.Arn}/*'

  SupportApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${StackPrefix}-support-api'
      Description: S3 direct integration for customer support case history
      EndpointConfiguration:
        Types:
          - REGIONAL

  # --- /support-cases/{customer_id} GET ---
  SupportCasesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SupportApi
      ParentId: !GetAtt SupportApi.RootResourceId
      PathPart: support-cases

  SupportCustomerIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SupportApi
      ParentId: !Ref SupportCasesResource
      PathPart: '{customer_id}'

  GetSupportCasesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SupportApi
      ResourceId: !Ref SupportCustomerIdResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      OperationName: get_support_cases
      RequestParameters:
        method.request.path.customer_id: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: GET
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${SupportCasesBucket}/cases/{customer_id}.json'
        Credentials: !GetAtt ApiGatewayS3Role.Arn
        RequestParameters:
          integration.request.path.customer_id: method.request.path.customer_id
        IntegrationResponses:
          - StatusCode: '200'
          - StatusCode: '404'
            SelectionPattern: '404'
