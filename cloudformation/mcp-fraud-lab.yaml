      DeploymentId: !Ref SupportApiDeployment
      StageName: prod
      Description: Production stage for support API
      TracingEnabled: true


  # =========================================================================
  # 10. AGENTCORE GATEWAY + 3 MCP TARGETS
  # =========================================================================
  AgentCoreGatewayRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-agentcore-gw-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: GatewayApiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource:
                  - !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${InvestigationApi}/prod/*'
                  - !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SupportApi}/prod/*'
              # KB-as-Gateway-target: the Gateway IAM role invokes the Managed KB
              # connector, so it needs Retrieve + GetKnowledgeBase on the KB.
              - Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: !GetAtt FraudKnowledgeBase.KnowledgeBaseArn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*'

  FraudGateway:
    Type: AWS::BedrockAgentCore::Gateway
    DependsOn:
      - InvestigationApiStage
      - SupportApiStage
    Properties:
      Name: !Sub '${StackPrefix}-investigation-gw'
      Description: MCP Gateway for fraud investigation tools
      ProtocolType: MCP
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          AllowedClients:
            - !Ref CognitoMachineClient
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration'
      RoleArn: !GetAtt AgentCoreGatewayRole.Arn
      Tags:
        Workshop: mcp-fraud-lab

  # --- Target 1: Investigation Data (DynamoDB via API Gateway) ---
  InvestigationTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    DependsOn: FraudGateway
    Properties:
      GatewayIdentifier: !GetAtt FraudGateway.GatewayIdentifier
      Name: investigation-data
      Description: Transaction data, customer profiles, login activity, and transaction holds via DynamoDB
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          ApiGateway:
            RestApiId: !Ref InvestigationApi
            Stage: prod
            ApiGatewayToolConfiguration:
              ToolFilters:
                - FilterPath: '/*'
                  Methods:
                    - GET
                    - POST
              ToolOverrides:
                - Name: get_transaction_details
                  Description: Retrieves full transaction info including amount, device, IP, shipping address
                  Path: /transactions/{transaction_id}
                  Method: GET
                - Name: hold_transaction
                  Description: Places a hold on a suspicious transaction
                  Path: /transactions/{transaction_id}/hold
                  Method: POST
                - Name: get_customer_profile
                  Description: Retrieves customer history, purchase patterns, account age
                  Path: /customers/{customer_id}
                  Method: GET
                - Name: get_login_activity
                  Description: Retrieves recent login events, devices, IPs, password changes
                  Path: /logins/{customer_id}
                  Method: GET

  # --- Target 2: Customer Support History (S3 via API Gateway) ---
  SupportTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    DependsOn: FraudGateway
    Properties:
      GatewayIdentifier: !GetAtt FraudGateway.GatewayIdentifier
      Name: customer-support-history
      Description: Customer support case history and dispute records from S3
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          ApiGateway:
            RestApiId: !Ref SupportApi
            Stage: prod
            ApiGatewayToolConfiguration:
              ToolFilters:
                - FilterPath: '/*'
                  Methods:
                    - GET
              ToolOverrides:
                - Name: get_support_cases
                  Description: Retrieves past support cases, dispute history, and previous fraud reports for a customer
                  Path: /support-cases/{customer_id}
                  Method: GET

  # --- Target 3: Fraud Playbooks (Managed KB via bedrock-knowledge-bases connector) ---
  # Replaces the agent's old built-in retrieve() tool. The Managed KB is exposed
  # as a native MCP target, so the agent discovers it through the Gateway exactly
  # like the DynamoDB and S3 tools (zero hardcoded integrations).
  FraudPlaybookTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    DependsOn:
      - FraudGateway
      - FraudKnowledgeBase
    Properties:
      GatewayIdentifier: !GetAtt FraudGateway.GatewayIdentifier
