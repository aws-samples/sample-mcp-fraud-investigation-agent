  # =========================================================================
  # 13. KB SYNC CUSTOM RESOURCE - Trigger initial KB data source sync
  # =========================================================================
  KBSyncRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-kb-sync-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockKBSync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                Resource:
                  - !GetAtt FraudKnowledgeBase.KnowledgeBaseArn

  KBSyncFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
    Properties:
      FunctionName: !Sub '${StackPrefix}-kb-sync'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt KBSyncRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt FunctionDlq.Arn
      Environment:
        Variables:
          KB_ID: !Ref FraudKnowledgeBase
          DS_ID: !GetAtt FraudKBDataSource.DataSourceId
      Code:
        ZipFile: |
          import os, time, boto3, json
          import urllib3
          http = urllib3.PoolManager()
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send_cfn(event, context, status, data={}):
              body = json.dumps({"Status": status, "Reason": "See CloudWatch", "PhysicalResourceId": context.log_stream_name, "StackId": event["StackId"], "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"], "Data": data})
              http.request("PUT", event["ResponseURL"], body=body, headers={"content-type": ""})
          bedrock = boto3.client('bedrock-agent')

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send_cfn(event, context, SUCCESS, {})
                  return
              try:
                  kb_id = os.environ['KB_ID']
                  ds_id = os.environ['DS_ID']
                  resp = bedrock.start_ingestion_job(
                      knowledgeBaseId=kb_id,
                      dataSourceId=ds_id
                  )
                  job_id = resp['ingestionJob']['ingestionJobId']
                  # Poll for completion (max 4 min)
                  for _ in range(24):
                      time.sleep(10)
                      status = bedrock.get_ingestion_job(
                          knowledgeBaseId=kb_id,
                          dataSourceId=ds_id,
                          ingestionJobId=job_id
                      )['ingestionJob']['status']
                      if status == 'COMPLETE':
                          send_cfn(event, context, SUCCESS, {"JobId": job_id})
                          return
                      elif status == 'FAILED':
                          send_cfn(event, context, FAILED, {"Error": "Ingestion failed"})
                          return
                  send_cfn(event, context, SUCCESS, {"JobId": job_id, "Note": "Sync still in progress"})
              except Exception as e:
                  send_cfn(event, context, FAILED, {"Error": str(e)})

  KBSyncTrigger:
    Type: Custom::KBSync
    DependsOn:
      - FraudKBDataSource
      - FraudPlaybooksBucket
      - SeedBootstrapTrigger
    Properties:
      ServiceToken: !GetAtt KBSyncFunction.Arn


  # =========================================================================
  # 14. ECR REPOSITORY - Hosts the agent Docker image
  # =========================================================================
  AgentEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub '${StackPrefix}-agent'
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt WorkshopKmsKey.Arn

  # =========================================================================
  # 15. CODEBUILD PROJECT - Builds the agent Docker image and pushes to ECR
  # =========================================================================
  AgentBuildSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      BucketName: !Sub '${StackPrefix}-agent-build-src-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: agent-build-src/

  AgentBuildRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-agent-build-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AgentBuildSourceBucket}/*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt AgentEcrRepo.Arn
              # CodeBuild uses the workshop customer-managed key to encrypt the
              # build environment, so its service role needs key usage.
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt WorkshopKmsKey.Arn

  AgentBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${StackPrefix}-agent-build'
      ServiceRole: !GetAtt AgentBuildRole.Arn
      EncryptionKey: !GetAtt WorkshopKmsKey.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPO_URI
            Value: !GetAtt AgentEcrRepo.RepositoryUri
          - Name: IMAGE_TAG
            Value: latest
      Source:
        Type: S3
        Location: !Sub '${AgentBuildSourceBucket}/source.zip'
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
            build:
              commands:
                - echo Building the Docker image for ARM64...
                - docker build -t $ECR_REPO_URI:$IMAGE_TAG .
            post_build:
              commands:
                - echo Pushing the Docker image...
                - docker push $ECR_REPO_URI:$IMAGE_TAG
                - echo Build complete
      TimeoutInMinutes: 20


  # =========================================================================
  # 16. LAMBDA CUSTOM RESOURCE - Zip agent source, upload, trigger CodeBuild
  # =========================================================================
  AgentSourceUploaderRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-agent-src-uploader-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentSourceUploaderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AgentBuildSourceBucket}/*'
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt AgentBuildProject.Arn

  AgentSourceUploaderFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
    Properties:
      FunctionName: !Sub '${StackPrefix}-agent-src-uploader'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt AgentSourceUploaderRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt FunctionDlq.Arn
      Environment:
        Variables:
          BUILD_BUCKET: !Ref AgentBuildSourceBucket
          BUILD_PROJECT: !Ref AgentBuildProject
      Code:
        ZipFile: |
          import json, os, io, zipfile, time, boto3
          import urllib3
          http = urllib3.PoolManager()
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send_cfn(event, context, status, data=None):
              body = json.dumps({
                  "Status": status, "Reason": "See CloudWatch",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              })
              http.request("PUT", event["ResponseURL"], body=body,
                          headers={"content-type": ""})
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send_cfn(event, context, SUCCESS)
                  return
              try:
                  bucket = os.environ['BUILD_BUCKET']
                  project = os.environ['BUILD_PROJECT']
                  # ------------------------------------------
                  # Agent source code (Dockerfile + agent.py + reqs)
                  # ------------------------------------------
                  dockerfile = (
                      "FROM --platform=linux/arm64 public.ecr.aws/docker/library/python:3.12-slim\n"
                      "ENV PYTHONUNBUFFERED=1\n"
                      "WORKDIR /app\n"
                      "COPY requirements.txt .\n"
                      "RUN pip install --no-cache-dir -r requirements.txt\n"
                      "RUN useradd -m -u 1000 bedrock_agentcore\n"
                      "COPY agent.py .\n"
                      "RUN chown -R bedrock_agentcore:bedrock_agentcore /app\n"
                      "USER bedrock_agentcore\n"
                      "EXPOSE 8080\n"
                      'CMD ["python", "agent.py"]\n'
                  )
                  requirements = (
                      "bedrock-agentcore==1.0.6\n"
                      "strands-agents==1.20.0\n"
                      "strands-agents-tools==0.2.15\n"
                      "boto3>=1.40.75\n"
                      "botocore>=1.40.75\n"
                      "mcp>=1.0.0\n"
                      "requests>=2.31.0\n"
                  )
                  agent_py = event['ResourceProperties']['AgentCode']

                  buf = io.BytesIO()
                  with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as zf:
                      zf.writestr('Dockerfile', dockerfile)
                      zf.writestr('requirements.txt', requirements)
                      zf.writestr('agent.py', agent_py)
                  buf.seek(0)

                  s3 = boto3.client('s3')
                  s3.put_object(Bucket=bucket, Key='source.zip',
                                Body=buf.getvalue())
                  print(f"Uploaded source.zip to s3://{bucket}/source.zip")

                  # Trigger CodeBuild
                  cb = boto3.client('codebuild')
                  start = cb.start_build(projectName=project)
                  build_id = start['build']['id']
                  print(f"Started build: {build_id}")

                  # Wait for build to complete (max 14 minutes)
                  for _ in range(84):  # 84 * 10s = 14 min
                      time.sleep(10)
                      resp = cb.batch_get_builds(ids=[build_id])
                      build = resp['builds'][0]
                      status = build['buildStatus']
                      print(f"Build status: {status}")
                      if status == 'SUCCEEDED':
                          send_cfn(event, context, SUCCESS,
                                   {"BuildId": build_id})
                          return
                      if status in ('FAILED', 'FAULT', 'TIMED_OUT',
                                    'STOPPED'):
                          send_cfn(event, context, FAILED,
                                   {"Error": f"Build {status}",
                                    "BuildId": build_id})
                          return
                  send_cfn(event, context, FAILED,
                           {"Error": "Build timeout",
                            "BuildId": build_id})
              except Exception as e:
                  print(f"ERROR: {e}")
                  send_cfn(event, context, FAILED, {"Error": str(e)})

  AgentSourceUploaderTrigger:
    Type: Custom::AgentSourceUploader
    DependsOn:
      - AgentBuildSourceBucket
      - AgentBuildProject
      - AgentEcrRepo
    Properties:
      ServiceToken: !GetAtt AgentSourceUploaderFunction.Arn
      Version: '7'
      AgentCode: |
        import os, json, boto3, requests, traceback
        from strands import Agent, tool
        from strands.models.bedrock import BedrockModel
        from strands.tools.mcp import MCPClient
        from mcp.client.streamable_http import streamablehttp_client
        from bedrock_agentcore.runtime import BedrockAgentCoreApp

        print("[AGENT] Starting fraud investigation agent", flush=True)

        PREFERRED_MODEL_ID = os.environ.get("BEDROCK_MODEL_ID",
            "us.anthropic.claude-sonnet-4-6")
        GATEWAY_URL = os.environ.get("GATEWAY_URL", "")
        KNOWLEDGE_BASE_ID = os.environ.get("KNOWLEDGE_BASE_ID", "")
        AWS_REGION = os.environ.get("AWS_REGION", "us-west-2")

        def _resolve_model_id(preferred, region):
            # Prefer the configured model. If it is not an ACTIVE inference
            # profile (deprecated or unavailable), fall back to the newest
            # available Claude so the workshop keeps working as models change.
            try:
                b = boto3.client("bedrock", region_name=region)
                ids = [p["inferenceProfileId"]
                       for p in b.list_inference_profiles(
                           maxResults=1000).get("inferenceProfileSummaries", [])
                       if p.get("status") == "ACTIVE"]
                if preferred in ids:
                    return preferred
                claude = sorted([i for i in ids if "anthropic.claude" in i],
                                reverse=True)
                sonnet = [i for i in claude if "sonnet" in i]
                chosen = (sonnet or claude or [preferred])[0]
                print(f"[AGENT] Model {preferred} unavailable; using {chosen}",
                      flush=True)
                return chosen
            except Exception as e:
                print(f"[AGENT] Model resolve failed ({e}); using {preferred}",
                      flush=True)
                return preferred

        BEDROCK_MODEL_ID = _resolve_model_id(PREFERRED_MODEL_ID, AWS_REGION)
        COGNITO_DOMAIN = os.environ.get("COGNITO_DOMAIN", "")
        COGNITO_CLIENT_ID = os.environ.get("COGNITO_CLIENT_ID", "")
        COGNITO_CLIENT_SECRET = os.environ.get("COGNITO_CLIENT_SECRET", "")
        COGNITO_SCOPE = os.environ.get("COGNITO_SCOPE", "")

        # bedrock_agent_runtime client removed: the fraud playbook KB is now an
        # MCP tool on the AgentCore Gateway, so the agent no longer calls
        # bedrock-agent-runtime.retrieve() directly.

        def get_gateway_token():
            r = requests.post(
                f"https://{COGNITO_DOMAIN}/oauth2/token",
                data={"grant_type": "client_credentials",
                      "client_id": COGNITO_CLIENT_ID,
                      "client_secret": COGNITO_CLIENT_SECRET,
                      "scope": COGNITO_SCOPE},
                headers={"Content-Type": "application/x-www-form-urlencoded"},
                timeout=30)
            r.raise_for_status()
            return r.json()["access_token"]

        # search_fraud_playbooks built-in tool removed. The fraud playbook
        # Knowledge Base is now discovered and invoked through the AgentCore
        # Gateway (fraud-playbooks target), the same way as the other MCP tools.

        SYSTEM_PROMPT = """You are an AI Fraud Investigation Agent for ShopSmart, an e-commerce company.

        Your role is to investigate flagged transactions by:
        1. Gathering transaction details, customer profiles, and login activity using MCP tools
        2. Checking customer support case history for prior fraud incidents
        3. Consulting fraud playbooks via the Knowledge Base for response procedures
        4. Correlating all signals to determine fraud confidence level
        5. Taking protective action (holding transactions) when warranted

        ## Investigation Process

        - Always start by getting the transaction details
        - Then gather customer profile and login activity
        - Check support case history for prior incidents
        - Consult fraud playbooks with your findings
        - Identify all anomaly signals and classify the threat
        - Take action based on playbook recommendations

        ## Show Your Reasoning (IMPORTANT)

        This investigation is observed live by analysts learning how the agent thinks.
        You MUST narrate your reasoning so they can follow along:

        1. Before each tool call, write a single line in this exact format:
           `> Calling \\`<tool_name>\\` to <verb> <object> because <reason>.`
           Example:
           `> Calling \\`get_login_activity\\` to retrieve recent logins for CUST-2847 because the transaction came from an unknown device at 2:47 AM.`

        2. After each tool result, write a single line in this exact format:
           `> Learned: <one-sentence insight>. <Optional next step>.`
           Example:
           `> Learned: Password was changed from a VPN IP 2 hours before the transaction - strong account-takeover signal. Checking support history next.`

        3. Keep these reasoning lines concise - one sentence each. Place them on their own line, prefixed with `> ` (markdown blockquote).

        ## Final Report Format

        When the investigation is complete, output a markdown report with these sections:

        ## Investigation Summary

        **Transaction:** TXN-XXXX  |  **Customer:** CUST-XXXX (Name)
        **Classification:** ACCOUNT TAKEOVER | CARD NOT PRESENT | SYNTHETIC IDENTITY | ...
        **Confidence:** LOW | MEDIUM | HIGH | CRITICAL
        **Fraud Score:** XX / 100

        ## Anomaly Signals (N detected)

        - **Spending anomaly** - $X vs avg $Y (Zx)
        - **Device anomaly** - unknown device fingerprint
        - **Geographic anomaly** - Miami shipping vs Chicago profile
        - ...

        ## Action Taken

        - Transaction held / released / flagged for manual review
        - Customer notified via email
        - ...

        ## Recommendation

        One or two sentences on next steps.

        Use proper markdown: bold for labels, bullet lists for signals, headings for sections.
        Be thorough but concise. Correlate signals across systems.
        """

        app = BedrockAgentCoreApp()

        @app.entrypoint
        async def invoke(payload):
            print(f"[AGENT] Received: {payload}", flush=True)
            user_input = payload.get("prompt", "")
            if not user_input:
                yield {"error": "No prompt provided"}
                return
            try:
                token = get_gateway_token()
                print("[AGENT] Got gateway token", flush=True)
                gateway_client = MCPClient(
                    lambda: streamablehttp_client(
                        url=GATEWAY_URL,
                        headers={"Authorization": f"Bearer {token}"}
                    ),
                    prefix="gateway",
                )
                print("[AGENT] MCP client created", flush=True)
                with gateway_client:
                    mcp_tools = gateway_client.list_tools_sync()
                    print(f"[AGENT] Discovered {len(list(mcp_tools))} tools", flush=True)
                    all_tools = list(mcp_tools)
                    model = BedrockModel(model_id=BEDROCK_MODEL_ID,
                        region_name=AWS_REGION)
                    agent = Agent(model=model,
                        tools=all_tools,
                        system_prompt=SYSTEM_PROMPT)
                    print("[AGENT] Streaming response...", flush=True)
                    async for event in agent.stream_async(user_input):
                        yield json.loads(json.dumps(dict(event), default=str))
            except Exception as e:
                print(f"[AGENT ERROR] {e}", flush=True)
                traceback.print_exc()
                yield {"error": str(e)}

        if __name__ == "__main__":
            print("[AGENT] Calling app.run()", flush=True)
            app.run()


  # =========================================================================
  # 17. AGENTCORE RUNTIME - Fraud Investigation Agent (container from ECR)
  # =========================================================================
  AgentRuntimeRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-agent-runtime-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: AgentRuntimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Invoke any foundation model or inference profile. Scoped to
              # Bedrock model resources rather than a blanket "*", but left
              # model-agnostic so the runtime's dynamic model resolver can fall
              # back to the latest available Claude if a model is deprecated.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:*:*:knowledge-base/*'
              # ListInferenceProfiles is an account-level read with no IAM
              # resource-level support; required by the dynamic model resolver.
              - Effect: Allow
                Action:
                  - bedrock:ListInferenceProfiles
                Resource: '*'
              # Marketplace subscription checks do not support resource-level
              # scoping; required for on-demand model access.
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt AgentEcrRepo.Arn
              # The ECR repository is encrypted with the workshop customer-managed
              # key, so the runtime role needs Decrypt to pull the agent image.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !GetAtt WorkshopKmsKey.Arn
              # GetAuthorizationToken returns an account-level token; must be "*".
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:/aws/bedrock-agentcore/*'
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt CognitoUserPool.Arn

  FraudInvestigationRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    DependsOn:
      - AgentSourceUploaderTrigger
    Properties:
      AgentRuntimeName: !Sub '${StackPrefix}_investigation_agent'
      Description: Fraud investigation agent with auto-discovered MCP tools
      RoleArn: !GetAtt AgentRuntimeRole.Arn
      ProtocolConfiguration: HTTP
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        KNOWLEDGE_BASE_ID: !Ref FraudKnowledgeBase
        AWS_REGION: !Ref AWS::Region
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        GATEWAY_URL: !GetAtt FraudGateway.GatewayUrl
        COGNITO_DOMAIN: !Sub '${StackPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
        COGNITO_CLIENT_ID: !Ref CognitoMachineClient
        COGNITO_SCOPE: !Sub '${StackPrefix}-gateway/invoke'
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub '${AgentEcrRepo.RepositoryUri}:latest'
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration'
          AllowedClients:
            - !Ref CognitoUserPoolClient
      Tags:
        Workshop: mcp-fraud-lab


  # =========================================================================
  # 18. SECRET INJECTOR - Fetches machine client secret, updates Runtime env
  # =========================================================================
  SecretInjectorRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-secret-injector-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretInjectorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt CognitoUserPool.Arn
              - Effect: Allow
                Action:
                  - bedrock-agentcore:UpdateAgentRuntime
                  - bedrock-agentcore:GetAgentRuntime
                Resource: !GetAtt FraudInvestigationRuntime.AgentRuntimeArn
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt AgentRuntimeRole.Arn

  SecretInjectorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
    Properties:
      FunctionName: !Sub '${StackPrefix}-secret-injector'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt SecretInjectorRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt FunctionDlq.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
          MACHINE_CLIENT_ID: !Ref CognitoMachineClient
          RUNTIME_ID: !GetAtt FraudInvestigationRuntime.AgentRuntimeId
          RUNTIME_ARN: !GetAtt FraudInvestigationRuntime.AgentRuntimeArn
          KB_ID: !Ref FraudKnowledgeBase
          GATEWAY_URL: !GetAtt FraudGateway.GatewayUrl
          MODEL_ID: !Ref BedrockModelId
          COGNITO_DOMAIN: !Sub '${StackPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
          COGNITO_SCOPE: !Sub '${StackPrefix}-gateway/invoke'
          ROLE_ARN: !GetAtt AgentRuntimeRole.Arn
          ECR_URI: !Sub '${AgentEcrRepo.RepositoryUri}:latest'
      Code:
        ZipFile: |
          import json, os, boto3
          import urllib3
          http = urllib3.PoolManager()
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send_cfn(event, context, status, data=None):
              body = json.dumps({
                  "Status": status, "Reason": "See CloudWatch",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              })
              http.request("PUT", event["ResponseURL"], body=body,
                          headers={"content-type": ""})
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send_cfn(event, context, SUCCESS)
                  return
              try:
                  cognito = boto3.client('cognito-idp')
                  resp = cognito.describe_user_pool_client(
                      UserPoolId=os.environ['USER_POOL_ID'],
                      ClientId=os.environ['MACHINE_CLIENT_ID']
                  )
                  secret = resp['UserPoolClient']['ClientSecret']
                  print(f"Got client secret (length: {len(secret)})")

                  ac = boto3.client('bedrock-agentcore-control')
                  # Fetch current runtime config to preserve authorizer
                  current = ac.get_agent_runtime(agentRuntimeId=os.environ['RUNTIME_ID'])
                  authorizer = current.get('authorizerConfiguration')

                  update_params = {
                      'agentRuntimeId': os.environ['RUNTIME_ID'],
                      'agentRuntimeArtifact': {
                          'containerConfiguration': {
                              'containerUri': os.environ['ECR_URI']
                          }
                      },
                      'networkConfiguration': {'networkMode': 'PUBLIC'},
                      'roleArn': os.environ['ROLE_ARN'],
                      'environmentVariables': {
                          'KNOWLEDGE_BASE_ID': os.environ['KB_ID'],
                          'AWS_REGION': os.environ.get('AWS_DEFAULT_REGION', 'us-west-2'),
                          'BEDROCK_MODEL_ID': os.environ['MODEL_ID'],
                          'GATEWAY_URL': os.environ['GATEWAY_URL'],
                          'COGNITO_DOMAIN': os.environ['COGNITO_DOMAIN'],
                          'COGNITO_CLIENT_ID': os.environ['MACHINE_CLIENT_ID'],
                          'COGNITO_CLIENT_SECRET': secret,
                          'COGNITO_SCOPE': os.environ['COGNITO_SCOPE'],
                      }
                  }
                  if authorizer:
                      update_params['authorizerConfiguration'] = authorizer
                      print(f"Preserving authorizer: {authorizer}")

                  ac.update_agent_runtime(**update_params)
                  print("Runtime env vars updated with secret")
                  send_cfn(event, context, SUCCESS, {"Message": "Secret injected"})
              except Exception as e:
                  print(f"ERROR: {e}")
                  send_cfn(event, context, FAILED, {"Error": str(e)})

  SecretInjectorTrigger:
    Type: Custom::SecretInjector
    DependsOn:
      - FraudInvestigationRuntime
      - CognitoMachineClient
      - CognitoUserPoolDomain
    Properties:
      ServiceToken: !GetAtt SecretInjectorFunction.Arn
      Version: '5'


  # =========================================================================
  # 19. AMPLIFY DEPLOY - Deploys pre-built dashboard to Amplify
  # =========================================================================
  AmplifyDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-amplify-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AmplifyDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                  - amplify:GetJob
                  - amplify:ListJobs
                Resource: !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${SeedStagingBucket}/*'

  AmplifyDeployFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
    Properties:
      FunctionName: !Sub '${StackPrefix}-amplify-deploy'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 180
      MemorySize: 512
      Role: !GetAtt AmplifyDeployRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt FunctionDlq.Arn
      Environment:
        Variables:
          APP_ID: !GetAtt FraudDashboardApp.AppId
          BRANCH_NAME: main
          SOURCE_BUCKET: !Ref SeedStagingBucket
          SOURCE_KEY: dashboard/build.zip
          REPLACE_COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
          REPLACE_AGENT_RUNTIME_ARN: !GetAtt FraudInvestigationRuntime.AgentRuntimeArn
          REPLACE_REGION: !Ref AWS::Region
          REPLACE_INVESTIGATION_API: !Sub 'https://${InvestigationApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
          REPLACE_SUPPORT_API: !Sub 'https://${SupportApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
          REPLACE_COGNITO_USER_POOL_ID: !Ref CognitoUserPool
      Code:
        ZipFile: |
          import json, os, io, zipfile, boto3, urllib3, time
          import urllib.request
          http = urllib3.PoolManager()
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send_cfn(event, context, status, data=None):
              body = json.dumps({
                  "Status": status, "Reason": "See CloudWatch",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              })
              http.request("PUT", event["ResponseURL"], body=body,
                          headers={"content-type": ""})
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send_cfn(event, context, SUCCESS)
                  return
              try:
                  amplify = boto3.client('amplify')
                  s3 = boto3.client('s3')
                  app_id = os.environ['APP_ID']
                  branch = os.environ['BRANCH_NAME']
                  bucket = os.environ['SOURCE_BUCKET']
                  key = os.environ['SOURCE_KEY']

                  # Replacement map: placeholder -> real value
                  replacements = {
                      "PLACEHOLDER_COGNITO_CLIENT_ID": os.environ['REPLACE_COGNITO_CLIENT_ID'],
                      "PLACEHOLDER_AGENT_RUNTIME_ARN": os.environ['REPLACE_AGENT_RUNTIME_ARN'],
                      "PLACEHOLDER_REGION": os.environ['REPLACE_REGION'],
                      "PLACEHOLDER_INVESTIGATION_API": os.environ['REPLACE_INVESTIGATION_API'],
                      "PLACEHOLDER_SUPPORT_API": os.environ['REPLACE_SUPPORT_API'],
                      "PLACEHOLDER_COGNITO_USER_POOL_ID": os.environ['REPLACE_COGNITO_USER_POOL_ID'],
                  }

                  # Download zip from S3
                  obj = s3.get_object(Bucket=bucket, Key=key)
                  zip_data = obj['Body'].read()
                  print(f"Downloaded zip: {len(zip_data)} bytes")

                  # Unzip, replace placeholders in JS files, re-zip
                  in_zip = zipfile.ZipFile(io.BytesIO(zip_data), 'r')
                  out_buf = io.BytesIO()
                  with zipfile.ZipFile(out_buf, 'w', zipfile.ZIP_DEFLATED) as out_zip:
                      for name in in_zip.namelist():
                          data = in_zip.read(name)
                          if name.endswith('.js') or name.endswith('.html'):
                              text = data.decode('utf-8')
                              for placeholder, real_val in replacements.items():
                                  text = text.replace(placeholder, real_val)
                              data = text.encode('utf-8')
                          out_zip.writestr(name, data)
                  in_zip.close()
                  patched_zip = out_buf.getvalue()
                  print(f"Patched zip: {len(patched_zip)} bytes, replacements applied")

                  # Create deployment and get upload URL
                  deploy = amplify.create_deployment(appId=app_id, branchName=branch)
                  job_id = deploy['jobId']
                  zip_url = deploy['zipUploadUrl']
                  print(f"Created deployment job: {job_id}")

                  # Upload patched zip to Amplify
                  req = urllib.request.Request(
                      zip_url, data=patched_zip, method='PUT',
                      headers={'Content-Type': 'application/zip'})
                  urllib.request.urlopen(req)
                  print("Uploaded patched zip to Amplify")

                  # Start deployment
                  amplify.start_deployment(appId=app_id, branchName=branch, jobId=job_id)
                  print("Deployment started")

                  # Wait for completion
                  for _ in range(30):
                      time.sleep(5)
                      job = amplify.get_job(appId=app_id, branchName=branch, jobId=job_id)
                      status = job['job']['summary']['status']
                      print(f"Status: {status}")
                      if status == 'SUCCEED':
                          send_cfn(event, context, SUCCESS, {"JobId": job_id})
                          return
                      if status in ('FAILED', 'CANCELLED'):
                          send_cfn(event, context, FAILED, {"Error": f"Deploy {status}"})
                          return
                  send_cfn(event, context, SUCCESS, {"JobId": job_id, "Note": "Still deploying"})
              except Exception as e:
                  print(f"ERROR: {e}")
                  import traceback
                  traceback.print_exc()
                  send_cfn(event, context, FAILED, {"Error": str(e)})

  AmplifyDeployTrigger:
    Type: Custom::AmplifyDeploy
    DependsOn:
      - FraudDashboardApp
      - FraudDashboardBranch
      - FraudInvestigationRuntime
      - SecretInjectorTrigger
      - SeedBootstrapTrigger
    Properties:
      ServiceToken: !GetAtt AmplifyDeployFunction.Arn
      Version: '6'

