    Properties:
      RestApiId: !Ref InvestigationApi
      ResourceId: !Ref CustomerIdResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      OperationName: get_customer_profile
      RequestParameters:
        method.request.path.customer_id: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:dynamodb:action/GetItem'
        Credentials: !GetAtt ApiGatewayDynamoDBRole.Arn
        RequestTemplates:
