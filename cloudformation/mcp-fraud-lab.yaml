AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MCP in Action: AI-Powered E-Commerce Fraud Investigation Workshop.
  Deploys Amplify dashboard, DynamoDB tables (imported from S3), S3 buckets for
  support cases and fraud playbooks, a Bedrock Managed Knowledge Base for the
  fraud playbooks, two API Gateway REST APIs (DynamoDB + S3 direct integration),
  AgentCore Gateway with 3 MCP targets, AgentCore Runtime (Strands SDK agent
  with SSE streaming and JWT auth), Cognito user pool, and all required IAM roles.
  Zero Lambda in the runtime path - dashboard calls AgentCore directly.

# ---------------------------------------------------------------------------
# Rules - Region Restriction
# ---------------------------------------------------------------------------
Rules:
  RegionRestriction:
    Assertions:
      - Assert:
          Fn::Contains:
            - - us-west-2
            - !Ref AWS::Region
        AssertDescription: >
          This workshop can only be deployed in us-west-2 (Oregon).
          Please switch to that region and try again.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  StackPrefix:
    Type: String
    Default: fraud
    Description: Prefix for resource names to avoid collisions.
    AllowedPattern: '^[a-z0-9-]{1,20}$'

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Foundation model ID for the AgentCore Runtime agent.

  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Embedding model for the Bedrock Knowledge Base.

  AssetsBucketName:
    Type: String
    Default: mcp-fraud-agent-workshop-test
    Description: >
      Name of the S3 bucket that holds seed-bundle.zip. The SeedBootstrap custom
      resource reads the bundle using its IAM role (S3 API, no public access needed,
      Block Public Access can stay fully on) and self-populates all seed data into
      buckets in this account, so the attendee never pre-stages anything and never
      touches the CLI. In a hosted Workshop Studio event, pass {{.AssetsBucketName}}.
  AssetsObjectKey:
    Type: String
    Default: seed-bundle.zip
    Description: >
      S3 key of the seed bundle within AssetsBucketName. In a hosted Workshop Studio
      event, pass {{.AssetsBucketPrefix}}seed-bundle.zip to include the workshop prefix.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # =========================================================================
  # 0. KMS KEY - Customer-managed key for data-at-rest encryption
  #   Shared customer-managed key used by the DynamoDB tables, the ECR
  #   repository, and the CodeBuild project. The key policy grants the account
  #   root full control (so IAM policies govern access) plus direct usage to the
  #   AWS services that encrypt on the stack's behalf. Automatic rotation is on.
  #   The key is deleted with the stack on workshop teardown, so it incurs only
  #   prorated cost for the lifetime of the event.
  #   Note: the Secrets Manager secret intentionally stays on the AWS-managed
  #   key. The workshop output asks the attendee to read that secret with the
  #   CLI, and a customer-managed key would require granting every attendee
  #   kms:Decrypt just to read their own generated password.
  # =========================================================================
  WorkshopKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub 'Customer-managed encryption key for the ${StackPrefix} fraud investigation workshop'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: workshop-key-policy
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowServiceUse
            Effect: Allow
            Principal:
              Service:
                - dynamodb.amazonaws.com
                - ecr.amazonaws.com
                - codebuild.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: '*'

  # =========================================================================
  # 0b. SHARED DEAD LETTER QUEUE for the CloudFormation custom-resource Lambdas
  #   The custom-resource Lambdas below are invoked synchronously by
  #   CloudFormation, so this DLQ is a defense-in-depth control rather than an
  #   active failure path (sync invocations surface errors directly in stack
  #   events). It is encrypted with the shared customer-managed key.
  # =========================================================================
  FunctionDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${StackPrefix}-${AWS::Region}-cr-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !Ref WorkshopKmsKey
      KmsDataKeyReusePeriodSeconds: 300

  # Managed policy (attached to the 7 custom-resource roles) granting send
  # access to the DLQ and use of the key that encrypts it. Delivered as a
  # managed policy rather than inline to keep the shared grant in one place.
  FunctionDlqAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${StackPrefix}-${AWS::Region}-cr-dlq-access'
      Roles:
        - !Ref WorkshopUserCreatorRole
        - !Ref SeedBootstrapRole
        - !Ref BucketCleanupRole
        - !Ref KBSyncRole
        - !Ref AgentSourceUploaderRole
        - !Ref SecretInjectorRole
        - !Ref AmplifyDeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt FunctionDlq.Arn
          - Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: !GetAtt WorkshopKmsKey.Arn

  # =========================================================================
  # 0c. ACCESS LOG BUCKET - S3 server access logging target for every bucket
  #   in this stack. It is the log destination, so it does not log to itself.
  # =========================================================================
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      BucketName: !Sub '${StackPrefix}-access-logs-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # -------------------------------------------------------------------------
  # TLS-only bucket policies for the four data buckets (deny non-HTTPS access).
  # -------------------------------------------------------------------------
  SupportCasesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SupportCasesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SupportCasesBucket.Arn
              - !Sub '${SupportCasesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  FraudPlaybooksBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FraudPlaybooksBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FraudPlaybooksBucket.Arn
              - !Sub '${FraudPlaybooksBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  SeedStagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SeedStagingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SeedStagingBucket.Arn
              - !Sub '${SeedStagingBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  AgentBuildSourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AgentBuildSourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AgentBuildSourceBucket.Arn
              - !Sub '${AgentBuildSourceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # =========================================================================
  # 1. COGNITO USER POOL - Gateway JWT Auth
  # =========================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${StackPrefix}-lab-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${StackPrefix}-lab-client'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false

  # -----------------------------------------------------------------------
  # Cognito Domain - required for OAuth2 token endpoint
  # -----------------------------------------------------------------------
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${StackPrefix}-${AWS::AccountId}'
      UserPoolId: !Ref CognitoUserPool

  # -----------------------------------------------------------------------
  # Resource Server - defines OAuth2 scopes the Gateway requires
  # -----------------------------------------------------------------------
  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Identifier: !Sub '${StackPrefix}-gateway'
      Name: !Sub '${StackPrefix}-gateway-resource-server'
      Scopes:
        - ScopeName: invoke
          ScopeDescription: Invoke access to the fraud investigation gateway

  # -----------------------------------------------------------------------
  # Machine Client - for agent to call Gateway (OAuth2 client_credentials)
  # -----------------------------------------------------------------------
  CognitoMachineClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      ClientName: !Sub '${StackPrefix}-machine-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - !Sub '${StackPrefix}-gateway/invoke'
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO

  # -----------------------------------------------------------------------
  # Auto-generated workshop user password (stored in Secrets Manager)
  # -----------------------------------------------------------------------
  WorkshopUserPassword:
    Type: AWS::SecretsManager::Secret
    Metadata:
      guard:
        SuppressedRules:
          - SECRETSMANAGER_USING_CMK
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
    Properties:
      Name: !Sub '${StackPrefix}-${AWS::Region}-workshop-user-password'
      Description: Auto-generated password for the workshop dashboard user
      GenerateSecretString:
        PasswordLength: 20
        ExcludePunctuation: false
        ExcludeCharacters: '"''\`/@:;,<>[]{}()%$#&*|'
        RequireEachIncludedType: true

  # -----------------------------------------------------------------------
  # Lambda custom resource: Create Cognito user with generated password
  # -----------------------------------------------------------------------
  WorkshopUserCreatorRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-user-creator-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UserCreatorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminDeleteUser
                Resource: !GetAtt CognitoUserPool.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref WorkshopUserPassword

  WorkshopUserCreatorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
    Properties:
      FunctionName: !Sub '${StackPrefix}-user-creator'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt WorkshopUserCreatorRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt FunctionDlq.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
          SECRET_ARN: !Ref WorkshopUserPassword
          USERNAME: !Sub '${StackPrefix}-admin@workshop.aws'
      Code:
        ZipFile: |
          import json, os, boto3
          import urllib3
          http = urllib3.PoolManager()
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send_cfn(event, context, status, data=None):
              body = json.dumps({
                  "Status": status, "Reason": "See CloudWatch",
                  "PhysicalResourceId": event.get("PhysicalResourceId", context.log_stream_name),
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              })
              http.request("PUT", event["ResponseURL"], body=body,
                          headers={"content-type": ""})
          def handler(event, context):
              user_pool_id = os.environ['USER_POOL_ID']
              username = os.environ['USERNAME']
              secret_arn = os.environ['SECRET_ARN']
              cognito = boto3.client('cognito-idp')
              sm = boto3.client('secretsmanager')

              if event['RequestType'] == 'Delete':
                  try:
                      cognito.admin_delete_user(UserPoolId=user_pool_id, Username=username)
                      print(f"Deleted user {username}")
                  except Exception as e:
                      print(f"Delete user failed (non-fatal): {e}")
                  send_cfn(event, context, SUCCESS, {})
                  return
              try:
                  # Get the auto-generated password
                  password = sm.get_secret_value(SecretId=secret_arn)['SecretString']
                  print(f"Retrieved password (length: {len(password)})")

                  # Create user (idempotent - ignore if exists)
                  try:
                      cognito.admin_create_user(
                          UserPoolId=user_pool_id,
                          Username=username,
                          TemporaryPassword='TempPass123!InitialOnly',
                          UserAttributes=[
                              {'Name': 'email', 'Value': username},
                              {'Name': 'email_verified', 'Value': 'true'},
                          ],
                          MessageAction='SUPPRESS',
                      )
                      print(f"Created user {username}")
                  except cognito.exceptions.UsernameExistsException:
                      print(f"User {username} already exists, updating password")

                  # Set permanent password from secret
                  cognito.admin_set_user_password(
                      UserPoolId=user_pool_id,
                      Username=username,
                      Password=password,
                      Permanent=True,
                  )
                  print(f"Password set for {username}")

                  send_cfn(event, context, SUCCESS, {"Username": username})
              except Exception as e:
                  print(f"ERROR: {e}")
                  import traceback
                  traceback.print_exc()
                  send_cfn(event, context, FAILED, {"Error": str(e)})

  WorkshopUserCreatorTrigger:
    Type: Custom::WorkshopUserCreator
    DependsOn:
      - CognitoUserPool
      - WorkshopUserPassword
      - WorkshopUserCreatorFunction
    Properties:
      ServiceToken: !GetAtt WorkshopUserCreatorFunction.Arn
      Version: '1'


  # =========================================================================
  # 2. DYNAMODB TABLES - Transactions, Customer Profiles, Login Activity
  # =========================================================================
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    DependsOn: SeedBootstrapTrigger
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${StackPrefix}-transactions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transaction_id
          AttributeType: S
      KeySchema:
        - AttributeName: transaction_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt WorkshopKmsKey.Arn
      ImportSourceSpecification:
        InputFormat: DYNAMODB_JSON
        S3BucketSource:
          S3Bucket: !Ref SeedStagingBucket
          S3KeyPrefix: seed-data/transactions/

  CustomerProfilesTable:
    Type: AWS::DynamoDB::Table
    DependsOn: SeedBootstrapTrigger
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${StackPrefix}-customer-profiles'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt WorkshopKmsKey.Arn
      ImportSourceSpecification:
        InputFormat: DYNAMODB_JSON
        S3BucketSource:
          S3Bucket: !Ref SeedStagingBucket
          S3KeyPrefix: seed-data/customer-profiles/

  LoginActivityTable:
    Type: AWS::DynamoDB::Table
    DependsOn: SeedBootstrapTrigger
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${StackPrefix}-login-activity'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt WorkshopKmsKey.Arn
      ImportSourceSpecification:
        InputFormat: DYNAMODB_JSON
        S3BucketSource:
          S3Bucket: !Ref SeedStagingBucket
          S3KeyPrefix: seed-data/login-activity/

  # =========================================================================
  # 4. S3 BUCKETS - Support Cases + Fraud Playbooks
  # =========================================================================
  SupportCasesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      BucketName: !Sub '${StackPrefix}-support-cases-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: support-cases/

  FraudPlaybooksBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      BucketName: !Sub '${StackPrefix}-playbooks-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: playbooks/

  # -----------------------------------------------------------------------
  # Seed staging bucket (this account). The SeedBootstrap custom resource
  # downloads the workshop seed bundle over HTTPS and writes the DynamoDB
  # import data and the dashboard build here. Keeping the
  # DynamoDB import source in-account avoids any cross-account S3 access and
  # removes the need for the attendee to pre-stage data or run the CLI.
  # -----------------------------------------------------------------------
  SeedStagingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      BucketName: !Sub '${StackPrefix}-seed-staging-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: seed-staging/

  # =========================================================================
  # 5. SEED BOOTSTRAP - Download seed bundle over HTTPS, populate buckets
  #   Turnkey self-serve: no pre-staged private bucket, no manual copy step.
  #   Reads s3://{AssetsBucketName}/{AssetsObjectKey} via the S3 API (IAM role,
  #   no public access) and routes each file:
  #     seed-data/transactions|customer-profiles|login-activity/  -> SeedStagingBucket (DynamoDB import)
  #     seed-data/playbooks/*                                     -> FraudPlaybooksBucket/playbooks/ (KB source)
  #     seed-data/support-cases/cases/*                           -> SupportCasesBucket/cases/ (support API)
  #     dashboard/build.zip, fraud-agent-lab.ipynb               -> SeedStagingBucket
  # =========================================================================
  SeedBootstrapRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-seed-bootstrap-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SeedBootstrapPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub '${SeedStagingBucket.Arn}/*'
                  - !Sub '${FraudPlaybooksBucket.Arn}/*'
                  - !Sub '${SupportCasesBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AssetsBucketName}/*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AssetsBucketName}'

  SeedBootstrapFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
    Properties:
      FunctionName: !Sub '${StackPrefix}-seed-bootstrap'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt SeedBootstrapRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt FunctionDlq.Arn
      Environment:
        Variables:
          ASSETS_BUCKET: !Ref AssetsBucketName
          ASSETS_KEY: !Ref AssetsObjectKey
          STAGING_BUCKET: !Ref SeedStagingBucket
          PLAYBOOKS_BUCKET: !Ref FraudPlaybooksBucket
          SUPPORT_BUCKET: !Ref SupportCasesBucket
      Code:
        ZipFile: |
          import os, io, json, zipfile, boto3, urllib3
          http = urllib3.PoolManager()
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send_cfn(event, context, status, data=None):
              # Surface the real error in the CloudFormation event message so a
              # failure is self-describing in the console (no CloudWatch dig).
              reason = (data or {}).get("Error") or "See CloudWatch logs"
              body = json.dumps({
                  "Status": status, "Reason": str(reason)[:1000],
                  "PhysicalResourceId": event.get("PhysicalResourceId", context.log_stream_name),
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              })
              http.request("PUT", event["ResponseURL"], body=body,
                          headers={"content-type": ""})
          def handler(event, context):
              if event["RequestType"] == "Delete":
                  send_cfn(event, context, SUCCESS, {})
                  return
              try:
                  src_bucket = os.environ["ASSETS_BUCKET"]
                  src_key = os.environ["ASSETS_KEY"]
                  staging = os.environ["STAGING_BUCKET"]
                  playbooks = os.environ["PLAYBOOKS_BUCKET"]
                  support = os.environ["SUPPORT_BUCKET"]
                  # Destination buckets are in this stack's region: use the default client.
                  s3 = boto3.client("s3")
                  # The assets bucket is the event's regional bucket, in the same
                  # region as this stack, so the default client reads it directly.
                  # Avoid a cross-region GetBucketLocation call: the Workshop Studio
                  # bucket policy denies requests made from another region.
                  print(f"Reading s3://{src_bucket}/{src_key}")
                  bundle = s3.get_object(Bucket=src_bucket, Key=src_key)["Body"].read()
                  print(f"Bundle size: {len(bundle)} bytes")
                  count = 0
                  with zipfile.ZipFile(io.BytesIO(bundle)) as zf:
                      for name in zf.namelist():
                          if name.endswith("/"):
                              continue
                          data = zf.read(name)
                          leaf = name.split("/")[-1]
                          if name.startswith("seed-data/playbooks/"):
                              dest_b, dest_k = playbooks, "playbooks/" + leaf
                          elif name.startswith("seed-data/support-cases/cases/"):
                              dest_b, dest_k = support, "cases/" + leaf
                          elif name.startswith("seed-data/"):
                              dest_b, dest_k = staging, name
                          elif name == "dashboard/build.zip":
                              dest_b, dest_k = staging, name
                          elif name == "fraud-agent-lab.ipynb":
                              dest_b, dest_k = staging, name
                          else:
                              continue
                          s3.put_object(Bucket=dest_b, Key=dest_k, Body=data)
                          count += 1
                  print(f"Wrote {count} objects")
                  send_cfn(event, context, SUCCESS, {"ObjectsWritten": count})
              except Exception as e:
                  import traceback
                  traceback.print_exc()
                  send_cfn(event, context, FAILED, {"Error": str(e)})

  SeedBootstrapTrigger:
    Type: Custom::SeedBootstrap
    DependsOn:
      - SeedStagingBucket
      - FraudPlaybooksBucket
      - SupportCasesBucket
    Properties:
      ServiceToken: !GetAtt SeedBootstrapFunction.Arn
      Version: '2'

  # =========================================================================
  # 5b. BUCKET CLEANUP - Empty all stack buckets on delete
  #   Makes teardown reliable. Versioned buckets (playbooks, support cases) and
  #   object-filled buckets (staging, build source) are emptied automatically
  #   on Delete, so DELETE_COMPLETE never stalls on a non-empty bucket. Because
  #   this resource DependsOn the buckets, CloudFormation deletes it (and runs
  #   its emptying logic) before it deletes the buckets themselves. Cleanup
  #   always reports SUCCESS on Delete so a cleanup hiccup never blocks teardown.
  # =========================================================================
  BucketCleanupRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-bucket-cleanup-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BucketCleanupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !GetAtt SeedStagingBucket.Arn
                  - !Sub '${SeedStagingBucket.Arn}/*'
                  - !GetAtt FraudPlaybooksBucket.Arn
                  - !Sub '${FraudPlaybooksBucket.Arn}/*'
                  - !GetAtt SupportCasesBucket.Arn
                  - !Sub '${SupportCasesBucket.Arn}/*'
                  - !GetAtt AgentBuildSourceBucket.Arn
                  - !Sub '${AgentBuildSourceBucket.Arn}/*'

  BucketCleanupFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
    Properties:
      FunctionName: !Sub '${StackPrefix}-bucket-cleanup'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt BucketCleanupRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt FunctionDlq.Arn
      Code:
        ZipFile: |
          import json, boto3, urllib3
          http = urllib3.PoolManager()
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send_cfn(event, context, status, data=None):
              reason = (data or {}).get("Error") or "OK"
              body = json.dumps({
                  "Status": status, "Reason": str(reason)[:1000],
                  "PhysicalResourceId": event.get("PhysicalResourceId", context.log_stream_name),
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              })
              http.request("PUT", event["ResponseURL"], body=body,
                          headers={"content-type": ""})
          def empty_bucket(s3, bucket):
              # Delete all versions and delete markers (handles versioned buckets)
              vpag = s3.get_paginator("list_object_versions")
              for page in vpag.paginate(Bucket=bucket):
                  objs = [{"Key": v["Key"], "VersionId": v["VersionId"]}
                          for v in page.get("Versions", []) + page.get("DeleteMarkers", [])]
                  if objs:
                      s3.delete_objects(Bucket=bucket, Delete={"Objects": objs})
              # Fallback for any current objects on non-versioned buckets
              opag = s3.get_paginator("list_objects_v2")
              for page in opag.paginate(Bucket=bucket):
                  objs = [{"Key": o["Key"]} for o in page.get("Contents", [])]
                  if objs:
                      s3.delete_objects(Bucket=bucket, Delete={"Objects": objs})
          def handler(event, context):
              if event["RequestType"] != "Delete":
                  send_cfn(event, context, SUCCESS, {})
                  return
              s3 = boto3.client("s3")
              for b in event.get("ResourceProperties", {}).get("Buckets", []):
                  try:
                      empty_bucket(s3, b)
                      print(f"Emptied {b}")
                  except Exception as e:
                      # Never block teardown on a cleanup error
                      print(f"Skip {b}: {e}")
              send_cfn(event, context, SUCCESS, {})

  BucketCleanupTrigger:
    Type: Custom::BucketCleanup
    DependsOn:
      - SeedStagingBucket
      - FraudPlaybooksBucket
      - SupportCasesBucket
      - AgentBuildSourceBucket
    Properties:
      ServiceToken: !GetAtt BucketCleanupFunction.Arn
      Version: '1'
      Buckets:
        - !Ref SeedStagingBucket
        - !Ref FraudPlaybooksBucket
        - !Ref SupportCasesBucket
        - !Ref AgentBuildSourceBucket

  # =========================================================================
  # 6 + 7. BEDROCK MANAGED KNOWLEDGE BASE - Fraud Playbooks
  #   Managed KB: Amazon Bedrock provisions and manages the vector store.
  #   No AWS::S3Vectors::VectorBucket or ::Index to declare here, and no
  #   StorageConfiguration block (compare to the VECTOR + S3 Vectors variant).
  # =========================================================================
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-kb-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: BedrockKBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EmbeddingModelAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
              - Sid: S3DataSourceAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FraudPlaybooksBucket.Arn
                  - !Sub '${FraudPlaybooksBucket.Arn}/*'
              # S3VectorsAccess removed: Managed KB manages the vector store,
              # so the KB role no longer needs s3vectors:* permissions.

  FraudKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub '${StackPrefix}-playbooks-kb'
      Description: Fraud detection playbooks and response procedures for the investigation agent
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: MANAGED
        ManagedKnowledgeBaseConfiguration:
          # For a MANAGED knowledge base, EmbeddingModelArn is still required by
          # the CFN schema. EmbeddingModelType CUSTOM reuses the Titan embedding
          # model referenced by the EmbeddingModelId parameter.
          EmbeddingModelArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
          EmbeddingModelType: CUSTOM
      # No StorageConfiguration: Amazon Bedrock manages the vector store for a MANAGED KB.

  FraudKBDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref FraudKnowledgeBase
      Name: !Sub '${StackPrefix}-playbooks-source'
      Description: S3 bucket containing fraud playbook documents
      # Managed KB does NOT accept Type: S3. It requires the new
      # MANAGED_KNOWLEDGE_BASE_CONNECTOR type. ConnectorParameters is a
      # pass-through JSON document, so the keys inside it are camelCase
      # (type, version, connectionConfiguration) unlike the PascalCase CFN
      # keys around it.
      DataSourceConfiguration:
        Type: MANAGED_KNOWLEDGE_BASE_CONNECTOR
        ManagedKnowledgeBaseConnectorConfiguration:
          ConnectorParameters:
            type: S3
            version: "1"
            connectionConfiguration:
              bucketName: !Ref FraudPlaybooksBucket
              bucketOwnerAccountId: !Ref AWS::AccountId
            filterConfiguration:
              inclusionPrefixes:
                - 'playbooks/'


  # =========================================================================
  # 8. API GATEWAY - DynamoDB Direct Integration (4 tools)
  # =========================================================================
  ApiGatewayDynamoDBRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Sub '${StackPrefix}-${AWS::Region}-apigw-dynamodb-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TransactionsTable.Arn
                  - !GetAtt CustomerProfilesTable.Arn
                  - !GetAtt LoginActivityTable.Arn
              # The tables are encrypted with the workshop customer-managed key,
              # so the API Gateway integration role needs to use that key to
              # read (Decrypt) and write (GenerateDataKey) item data.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt WorkshopKmsKey.Arn

  InvestigationApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${StackPrefix}-investigation-api'
      Description: DynamoDB direct integration for fraud investigation tools
      EndpointConfiguration:
        Types:
          - REGIONAL

  # --- /transactions/{transaction_id} GET ---
  TransactionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InvestigationApi
      ParentId: !GetAtt InvestigationApi.RootResourceId
      PathPart: transactions

  TransactionIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InvestigationApi
      ParentId: !Ref TransactionsResource
      PathPart: '{transaction_id}'

  GetTransactionMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref InvestigationApi
      ResourceId: !Ref TransactionIdResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      OperationName: get_transaction_details
      RequestParameters:
        method.request.path.transaction_id: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:dynamodb:action/GetItem'
        Credentials: !GetAtt ApiGatewayDynamoDBRole.Arn
        RequestTemplates:
          application/json: !Sub |
            {
              "TableName": "${TransactionsTable}",
              "Key": {
                "transaction_id": {"S": "$input.params('transaction_id')"}
              }
            }
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: |
                #set($item = $input.path('$.Item'))
                #if($item && $item != "")
                {
                  "transaction_id": "$item.transaction_id.S",
                  "customer_id": "$item.customer_id.S",
                  "amount": "$item.amount.S",
                  "avg_order_value": "$item.avg_order_value.S",
                  "timestamp": "$item.timestamp.S",
                  "device": "$item.device.S",
                  "shipping_city": "$item.shipping_city.S",
                  "shipping_state": "$item.shipping_state.S",
                  "category": "$item.category.S",
                  "payment_method": "$item.payment_method.S",
                  "device_fingerprint": "$item.device_fingerprint.S",
                  "status": "$item.status.S"
                }
                #else
                {"error": "Transaction not found"}
                #end
      MethodResponses:
        - StatusCode: '200'

  # --- /transactions/{transaction_id}/hold POST ---
  HoldResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InvestigationApi
      ParentId: !Ref TransactionIdResource
      PathPart: hold

  HoldTransactionMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref InvestigationApi
      ResourceId: !Ref HoldResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      OperationName: hold_transaction
      RequestParameters:
        method.request.path.transaction_id: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:dynamodb:action/UpdateItem'
        Credentials: !GetAtt ApiGatewayDynamoDBRole.Arn
        RequestTemplates:
          application/json: !Sub |
            {
              "TableName": "${TransactionsTable}",
              "Key": {
                "transaction_id": {"S": "$input.params('transaction_id')"}
              },
              "UpdateExpression": "SET #s = :held",
              "ExpressionAttributeNames": {"#s": "status"},
              "ExpressionAttributeValues": {":held": {"S": "held"}},
              "ReturnValues": "ALL_NEW"
            }
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: |
                #set($item = $input.path('$.Attributes'))
                {
                  "transaction_id": "$item.transaction_id.S",
                  "status": "$item.status.S",
                  "message": "Transaction held successfully"
                }
      MethodResponses:
        - StatusCode: '200'

  # --- /customers/{customer_id} GET ---
  CustomersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InvestigationApi
      ParentId: !GetAtt InvestigationApi.RootResourceId
      PathPart: customers

  CustomerIdResource:
    Type: AWS::ApiGateway::Resource
